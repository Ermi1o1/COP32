# Publishes /prototype as a static site. Does nothing until the repo owner enables
# Settings -> Pages -> Source: "GitHub Actions". Prototype only; sample data.
name: Deploy prototype to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['prototype/**']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Version carriers agree (blocks a stale-cache deploy)
        run: python3 prototype/release.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: prototype }
      - id: d
        uses: actions/deploy-pages@v4
