# Fast checks on pull requests that touch the prototype. No deploy.
name: Prototype checks
on:
  pull_request:
    paths: ['prototype/**', '.github/workflows/**']
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version carriers agree
        run: python3 prototype/release.py --check
      - name: JavaScript parses
        run: for f in prototype/*.js; do node -e "new (require('vm').Script)(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - name: Manifest is valid JSON
        run: python3 -m json.tool prototype/manifest.webmanifest > /dev/null
